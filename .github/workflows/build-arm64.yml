name: Build ARM64 Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "crates/**"
      - "frontend/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile.app.local"
      - ".github/workflows/build-arm64.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: aether-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aether" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.app.local
          platforms: linux/arm64
          push: true
          build-args: |
            AETHER_BUILD_VERSION=git-${{ steps.meta.outputs.short_sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:git-${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image }}:git-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=aether-arm64
          cache-to: type=gha,mode=max,scope=aether-arm64
          provenance: mode=max
          sbom: true

      - name: Build summary
        run: |
          {
            echo "## Aether ARM64 image"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${{ steps.meta.outputs.image }}:git-${{ steps.meta.outputs.short_sha }}\`"
            echo "- Rolling tag: \`${{ steps.meta.outputs.image }}:git-latest\`"
            echo "- Platform: \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
